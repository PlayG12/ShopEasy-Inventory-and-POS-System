services:
  mysql:
    image: mysql:8.0
    container_name: shopeasy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: shopeasy123
      MYSQL_DATABASE: shopeasy
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - shopeasy-mysql-data:/var/lib/mysql

volumes:
  shopeasy-mysql-data:
